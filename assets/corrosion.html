<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrosion Portal</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .nav-bar {
            background-color: #1c1c1c;
            padding: 10px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            border-bottom: 1px solid #2d2d2d;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            background-color: #252525;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #555;
        }
        button {
            padding: 10px 20px;
            background-color: #2d2d2d;
            color: #ffffff;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        button:hover {
            background-color: #3d3d3d;
            border-color: #4a4a4a;
        }
        .frame-container {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <input type="text" id="urlInput" placeholder="Enter target site URL or search term...">
        <button id="surfBtn">Go</button>
    </div>

    <div class="frame-container">
        <iframe id="proxyFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock"></iframe>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const surfBtn = document.getElementById('surfBtn');
        const proxyFrame = document.getElementById('proxyFrame');

        function launchUrl() {
            let target = urlInput.value.trim();
            if (!target) return;

            if (!target.startsWith('http://') && !target.startsWith('https://')) {
                if (target.includes('.') && !target.includes(' ')) {
                    target = 'https://' + target;
                } else {
                    target = 'https://google.com' + encodeURIComponent(target);
                }
            }

            proxyFrame.src = target;
        }

        surfBtn.addEventListener('click', launchUrl);
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') launchUrl();
        });
    </script>
</body>
</html>
